<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Your Meal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Include Chart.js -->
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f8f8f8; }
        h1, h2 { color: #333; }
        input, button { padding: 10px; margin: 10px; font-size: 16px; }
        button { background: #ff5733; color: white; border: none; cursor: pointer; }
        button:hover { background: #d94325; }
        .chart-container { width: 80%; margin: auto; }
    </style>
</head>
<body>
    <header>
        <h1>Log Your Meal</h1>
    </header>

    <main>
        <h2>🍳 Breakfast <span id="breakfast-calories">0</span> kcal</h2>
        <input type="text" id="breakfast-food" placeholder="Enter food (e.g., Egg, Bread)">
        <button onclick="logMeal('breakfast')">Log Breakfast</button>

        <h2>🍛 Lunch <span id="lunch-calories">0</span> kcal</h2>
        <input type="text" id="lunch-food" placeholder="Enter food (e.g., Rice, Chicken)">
        <button onclick="logMeal('lunch')">Log Lunch</button>

        <h2>🍽️ Dinner <span id="dinner-calories">0</span> kcal</h2>
        <input type="text" id="dinner-food" placeholder="Enter food (e.g., Pasta, Salad)">
        <button onclick="logMeal('dinner')">Log Dinner</button>

        <h2><strong>Total Calories Today:</strong> <span id="total-calories">0</span> kcal</h2>

        <!-- Graph Container -->
        <div class="chart-container">
            <canvas id="calorieChart"></canvas>
        </div>

        <a href="burn-calories.html">🔥 Burn Calories</a>
    </main>

    <script>
        const API_KEY = 'W1aQFyaXYpgFtthigihwXw==fO5ztocG75oPCYVZ'; // Replace with your actual API key

        async function fetchCalories(foodItem) {
            try {
                const response = await fetch(`https://api.calorieninjas.com/v1/nutrition?query=${encodeURIComponent(foodItem)}`, {
                    headers: { 'X-Api-Key': API_KEY }
                });

                if (!response.ok) throw new Error(`API request failed with status ${response.status}`);

                const data = await response.json();
                return data.items.length > 0 ? data.items[0].calories : 0;
            } catch (error) {
                console.error('Error fetching calorie data:', error);
                return 0;
            }
        }

        async function logMeal(mealType) {
            const foodInput = document.getElementById(`${mealType}-food`).value.trim();
            if (!foodInput) return alert('Please enter a food item.');

            const calories = await fetchCalories(foodInput);
            if (calories === 0) return alert('No calorie data found for this food item.');

            const spanId = `${mealType}-calories`;
            const currentCalories = parseInt(document.getElementById(spanId).innerText);
            document.getElementById(spanId).innerText = currentCalories + calories;

            updateTotalCalories();
            document.getElementById(`${mealType}-food`).value = '';
        }

        function updateTotalCalories() {
            const total = ['breakfast', 'lunch', 'dinner'].reduce((sum, meal) => 
                sum + parseInt(document.getElementById(`${meal}-calories`).innerText), 0);

            document.getElementById('total-calories').innerText = total;
            localStorage.setItem('totalCalories', total); // Store in localStorage
            updateCalorieGraph();
        }

        function updateCalorieGraph() {
            const ctx = document.getElementById('calorieChart').getContext('2d');
            if (window.calorieChartInstance) window.calorieChartInstance.destroy();

            window.calorieChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Breakfast', 'Lunch', 'Dinner'],
                    datasets: [{
                        label: 'Calories Consumed',
                        data: ['breakfast', 'lunch', 'dinner'].map(meal =>
                            parseInt(document.getElementById(`${meal}-calories`).innerText)),
                        backgroundColor: ['#ff9999', '#66b3ff', '#99ff99']
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        document.addEventListener('DOMContentLoaded', updateCalorieGraph);
    </script>
</body>
</html>
