<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Intake Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f0f8ff; }
        h1, h2 { color: #007bff; }
        input, button { padding: 10px; margin: 10px; font-size: 16px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #water-progress { width: 80%; margin: auto; background: #e0e0e0; height: 20px; border-radius: 10px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #007bff; }
    </style>
</head>
<body>
    <header>
        <h1>💧 Water Intake Tracker</h1>
    </header>

    <main>
        <h2>🚰 Total Water Consumed: <strong id="total-water">0</strong> ml</h2>
        <input type="number" id="water-amount" placeholder="Enter water in ml">
        <button onclick="logWater()">Add Water</button>

        <h2>🥤 Recommended: 2000 ml/day</h2>
        <div id="water-progress">
            <div id="progress-bar"></div>
        </div>
        <p id="hydration-status">Status: Keep Hydrating! 💦</p>

        <a href="meal-log.html" class="btn">⬅️ Back to Meal Log</a>
    </main>

    <script>
        function logWater() {
            let waterInput = document.getElementById('water-amount').value;
            if (!waterInput || waterInput <= 0) return alert("Enter a valid amount!");

            let totalWater = parseInt(localStorage.getItem('totalWater')) || 0;
            totalWater += parseInt(waterInput);

            localStorage.setItem('totalWater', totalWater);
            updateWaterDisplay();
            document.getElementById('water-amount').value = '';
        }

        function updateWaterDisplay() {
            let totalWater = parseInt(localStorage.getItem('totalWater')) || 0;
            document.getElementById('total-water').innerText = totalWater;

            let progress = Math.min((totalWater / 2000) * 100, 100);
            document.getElementById('progress-bar').style.width = progress + '%';

            let statusText = totalWater >= 2000 ? "✅ You've met your daily goal!" :
                             totalWater >= 1500 ? "Almost there! 💙" :
                             totalWater >= 1000 ? "Halfway done! Keep going! 💦" :
                             "Drink more water! 🚰";
            document.getElementById('hydration-status').innerText = "Status: " + statusText;
        }

        document.addEventListener('DOMContentLoaded', updateWaterDisplay);
    </script>
</body>
</html>
