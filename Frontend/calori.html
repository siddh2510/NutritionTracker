<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Calorie Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🥗 Daily Calorie Tracker</h1>
    </header>

    <main>
        <div class="container">
            <h2>Track Your Daily Intake 🍽️</h2>

            <div class="stats">
                <h3>Today's Calorie Intake</h3>
                <p>🍳 Breakfast: <span id="breakfast-calories">0</span> kcal</p>
                <p>🍛 Lunch: <span id="lunch-calories">0</span> kcal</p>
                <p>🍽️ Dinner: <span id="dinner-calories">0</span> kcal</p>
                <p>🔥 Total Calories: <span id="total-calories">0</span> kcal</p>
                <p>💧 Water Intake: <span id="water-intake">0</span> / 8 glasses</p>
            </div>

            <div class="buttons">
                <a href="meal-log.html" class="btn">🍽️ Log a Meal</a>
                <a href="burn_calories.html" class="btn">🔥 Burn Calories </a>
                <a href="Water.html" class="btn">💦 Log Water Intake</a>
                
            </div>
        </div>
    </main>🍽️ Log a Meal
   
   
    <script src="script.js"></script>
</body>
</html>
